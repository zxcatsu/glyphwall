name: build
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean GlyphWall.spec
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\GlyphWall.iss'
      - run: Compress-Archive -Path dist/GlyphWall/* -DestinationPath GlyphWall-portable.zip
      - uses: actions/upload-artifact@v4
        with: { name: GlyphWall-portable, path: GlyphWall-portable.zip }
      - uses: actions/upload-artifact@v4
        with: { name: GlyphWall-Setup, path: installer/GlyphWall-Setup.exe }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/GlyphWall-Setup.exe
            GlyphWall-portable.zip
          generate_release_notes: false
